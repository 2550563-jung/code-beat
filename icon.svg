<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2140"/>
      <stop offset="1" stop-color="#120e1c"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffc94a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffc94a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe28a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffc94a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="sq"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- lanes -->
    <g opacity=".14">
      <rect x="76" y="0" width="84" height="512" fill="#a98bff"/>
      <rect x="166" y="0" width="84" height="512" fill="#3fd0c9"/>
      <rect x="262" y="0" width="84" height="512" fill="#3fd0c9"/>
      <rect x="352" y="0" width="84" height="512" fill="#a98bff"/>
    </g>
    <!-- beam on the hit lane -->
    <rect x="166" y="150" width="84" height="230" fill="url(#beam)"/>
    <!-- falling notes -->
    <rect x="86" y="96" width="64" height="30" rx="10" fill="#a98bff"/>
    <rect x="272" y="168" width="64" height="30" rx="10" fill="#3fd0c9"/>
    <rect x="362" y="240" width="64" height="30" rx="10" fill="#a98bff"/>
    <rect x="86" y="292" width="64" height="30" rx="10" fill="#a98bff"/>
    <rect x="272" y="48" width="64" height="30" rx="10" fill="#3fd0c9" opacity=".7"/>
    <!-- hit line -->
    <rect x="56" y="374" width="400" height="10" rx="5" fill="#f1ebf8"/>
    <!-- note being hit -->
    <ellipse cx="208" cy="379" rx="92" ry="54" fill="url(#glow)"/>
    <rect x="170" y="362" width="76" height="34" rx="12" fill="#ffc94a"/>
    <rect x="182" y="368" width="52" height="5" rx="2.5" fill="#fff6d6"/>
    <!-- burst ring -->
    <ellipse cx="208" cy="379" rx="70" ry="30" fill="none" stroke="#ffc94a" stroke-width="5" opacity=".8"/>
  </g>
</svg>
